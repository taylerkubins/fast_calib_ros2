    # Input
    lidar_topic: "/livox/lidar"  #"/livox/lidar" # /ouster/points /livox/lidar
    #max_lidar_frames: 3
    bag_path: "/home/byd/cxl/bag/0817-hand-hold/rosbag2_2026_08_17-09_43_13" #"/home/tommy/FAST-Calib/FAST-Calib-ROS2/calib_data/mid360_11"
