    # LiDAR 与相机轴安装映射（用于圆心排序时的坐标对齐）
    # 格式：相机各轴由哪条 LiDAR 轴及符号得到。可选: "x", "-x", "y", "-y", "z", "-z"
    # 示例：lidar_x->相机z, lidar_y->相机-x, lidar_z->相机-y 即默认 Livox 常见安装
    lidar_axis_cam_x: "-y"   # 相机 X = -LiDAR Y
    lidar_axis_cam_y: "-z"   # 相机 Y = -LiDAR Z
    lidar_axis_cam_z: "x"    # 相机 Z = LiDAR X

