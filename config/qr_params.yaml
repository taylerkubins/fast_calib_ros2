    # Calibration target parameters
    marker_size: 0.20 # ArUco marker size (our test data uses 0.16m; adjust to match your marker size)
    delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction 
    delta_height_qr_center: 0.35 # Half the distance between the centers of two markers in the vertical direction
    delta_width_circles: 0.50 # Distance between the centers of two circles in the horizontal direction
    delta_height_circles: 0.40 # Distance between the centers of two circles in the vertical direction
    circle_radius: 0.12 # Radius of the circle (m)
    circle_fit_error_threshold: 0.05 # LiDAR 圆拟合可接受误差阈值，小于该值的圆心才被接受
    circle_center_merge_distance: 0.10 # 两圆心平面距离小于此值视为同一圆，保留误差更小者，可消除“一圆两心”
    edge_cluster_min_size: 30 # 边缘聚类最小点数，点少的圆孔漏检时可适当减小（如 20）

    # marker_size: 0.20 # ArUco marker size (our test data uses 0.16m; adjust to match your marker size)
    # delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction 
